# Gradle settings. Versions live in gradle/libs.versions.toml, not here.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Loom and IntelliJ are not yet compatible with the configuration cache (fabric-loom issue 1349).
org.gradle.configuration-cache=false

# The mod version is set in build.gradle.kts (release scheme <mod SemVer>+<minecraft version>,
# docs/spec/operations/release.md); CHANGELOG.md carries the same number.
